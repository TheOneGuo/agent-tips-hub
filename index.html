<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent 使用技巧知识库 · 按工作场景分类</title>
<meta name="description" content="覆盖 Claude、Codex、WorkBuddy、Trae、豆包、Qoder、千问办公、即梦、可灵、Kimi 等主流 AI Agent 的实战技巧知识库，覆盖写作、小红书、公众号、影视、AI 电影、广告、法务、编程、数据分析等场景。">
<style>
:root{
  --bg:#f6f6f3; --card:#ffffff; --ink:#1b1e28; --ink2:#4b5060; --ink3:#8a8fa3;
  --line:#e5e6ee; --accent:#4f46e5; --accent2:#7c3aed;
  --radius:14px; --shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px -12px rgba(20,24,60,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hero{background:radial-gradient(1100px 560px at 85% -10%,rgba(124,58,237,.32),transparent 60%),radial-gradient(900px 480px at 5% 112%,rgba(79,70,229,.26),transparent 55%),linear-gradient(140deg,#0f1226,#1e1b4b);color:#fff;padding:44px 24px 54px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000 30%,transparent);pointer-events:none}
.hero-in{max-width:1120px;margin:0 auto;position:relative;z-index:1}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:6px 14px;border-radius:999px;font-size:13px;color:#dcd9ff}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.5px;margin:20px 0 12px;line-height:1.25}
.hero h1 .mark{background:linear-gradient(transparent 68%,rgba(250,204,21,.55) 68%);padding:0 2px}
.hero .sub{max-width:780px;color:#c7c9e8;font-size:16px;margin-bottom:30px}
.hero .sub b{color:#eef}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.dim{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);border-radius:var(--radius);padding:18px 20px}
.dim .ico{font-size:24px}
.dim h3{font-size:16.5px;margin:9px 0 3px}
.dim .en{font-size:11.5px;color:#9aa0c7;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:7px}
.dim p{font-size:13.2px;color:#c7c9e8}
.golden{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius);padding:20px 22px;margin-bottom:26px}
.golden h3{font-size:15.5px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.golden .hint{font-size:12.8px;color:#9aa0c7;margin-bottom:12px}
.prompt-box{background:#0d0f1f;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:15px 17px;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.8px;color:#d7dcff;white-space:pre-wrap;position:relative;line-height:1.8}
.copy-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#dfe3ff;font-size:12px;padding:4px 12px;border-radius:7px;cursor:pointer;transition:.2s}
.copy-btn:hover{background:rgba(255,255,255,.22)}
.copy-btn.done{background:#10b981;border-color:#10b981;color:#fff}
.quick h2{font-size:16px;margin-bottom:12px;color:#e8e8ff}
.quick-grid{display:flex;flex-wrap:wrap;gap:10px}
.qbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#e6e6ff;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s}
.qbtn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);transform:translateY(-1px)}
.stats{max-width:1120px;margin:-26px auto 0;padding:0 24px;position:relative;z-index:2}
.stats-in{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);padding:16px 8px}
.stat{text-align:center;padding:2px 8px}
.stat b{font-size:25px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.sticky{position:sticky;top:0;z-index:50;background:rgba(246,246,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1120px;margin:0 auto;padding:16px 24px 8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:230px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--line);border-radius:11px;font-size:14.5px;background:var(--card);color:var(--ink);outline:none;transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.14)}
.search .s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 7px;background:#fafafe}
select{padding:10px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--card);color:var(--ink);outline:none;cursor:pointer}
.reset{padding:10px 15px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink2);font-size:13.5px;cursor:pointer;transition:.2s}
.reset:hover{border-color:#ef4444;color:#ef4444}
.groups{max-width:1120px;margin:0 auto;padding:10px 24px 4px;display:flex;gap:8px;flex-wrap:wrap}
.gtab{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;transition:.18s}
.gtab:hover{background:#ececf5}
.gtab.on{background:var(--ink);color:#fff}
.gtab .n{font-size:11px;opacity:.7}
.chips{max-width:1120px;margin:0 auto;padding:2px 24px 12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink2);font-size:13px;cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .n{font-size:11px;opacity:.72;margin-left:3px}
.meta{max-width:1120px;margin:0 auto;padding:0 24px 12px;color:var(--ink3);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.meta b{color:var(--accent)}
.gridwrap{max-width:1120px;margin:0 auto;padding:0 24px 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.2s;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.card,.qbtn{transition:none}}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(20,24,60,.06),0 16px 32px -14px rgba(20,24,60,.18);border-color:#d5d8ea}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
.cat-dot{width:8px;height:8px;border-radius:3px;flex:none}
.lvl{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.5px;flex:none}
.lvl-0{background:#e7f8f1;color:#0b9e6d}
.lvl-1{background:#e8f0fe;color:#2f6fe4}
.lvl-2{background:#fdf0e0;color:#c07708}
.card h3{font-size:15.8px;font-weight:700;line-height:1.45;margin-bottom:7px}
.agents{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.atag{font-size:11px;padding:2px 8px;border-radius:6px;background:#eef0fb;color:#5b5fd6;font-weight:600}
.card p{font-size:13.5px;color:var(--ink2);flex:1}
.card .ex-toggle{margin-top:11px;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:none;border:none;padding:0;text-align:left}
.card .ex-toggle:hover{text-decoration:underline}
.card .ex{display:none;margin-top:10px;background:#f7f8fd;border:1px dashed #d9dcf0;border-radius:10px;padding:12px 14px;font-size:12.6px;color:#3d4260;white-space:pre-wrap;line-height:1.75;position:relative}
.card .ex.show{display:block}
.card .ex .copy-btn{top:8px;right:8px;background:#eceefc;border-color:#d5d8f0;color:#555bd8}
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--ink3)}
.empty .big{font-size:42px;margin-bottom:10px}
footer{text-align:center;padding:24px 20px 38px;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--line)}
#toTop{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:19px;cursor:pointer;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 20px -6px rgba(79,70,229,.55);z-index:60}
#toTop.show{opacity:1;pointer-events:auto}
@media(max-width:820px){.dims{grid-template-columns:1fr}.stats-in{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3),.stat:nth-child(4){border-top:1px solid var(--line);padding-top:10px}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{padding:30px 16px 44px}.wrap,.groups,.chips,.meta{padding-left:16px;padding-right:16px}.gridwrap{padding:0 16px 26px}.stats{padding:0 16px}}
</style>
</head>
<body>
<!-- FULL_BODY_PLACEHOLDER -->
</body>
</html>
